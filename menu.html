<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>المينو - OX</title>
</head>

<body>
    <div class="wrap">
        <h1 class="logo">OX</h1>
        <div class="tag">STYLE • GIFT • YOU</div>
        <div class="sep">— ♡ —</div>
        <div id="list">جاري التحميل...</div>
        <div class="foot">📍 بجانب البنك الزراعي</div><a class="back" href="index.html">← رجوع</a>
    </div>
    <script>
        fetch("menu.json?t=" + Date.now()).then(r => r.json()).then(d => {
            list.innerHTML = d.items.map(i => '<div class="row"><span>' + i.name + '</span><span class="price">' + i.price + '</span></div>').join("");
        }).catch(() => list.textContent = "تعذر تحميل المينو");
    </script>
</body>

</html>
